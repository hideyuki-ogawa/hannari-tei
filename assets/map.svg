<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250"><rect width="430" height="250" fill="#fff"/><g font-family="serif" fill="#222"><text x="15" y="24" font-size="15">祇園四条・宮川町界隈（教材用の模式図）</text><rect x="20" y="54" width="165" height="46" fill="#eee" stroke="#555"/><text x="33" y="82" font-size="17">京阪 祇園四条駅</text><path d="M102 104V146H232" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/><text x="117" y="126" font-size="12">徒歩約7分の設定</text><rect x="202" y="148" width="205" height="55" fill="#fff4a3" stroke="#555"/><text x="215" y="171" font-size="17" fill="#a00000">● はんなり亭（架空）</text><text x="215" y="191" font-size="12">宮川町界隈という設定</text><text x="15" y="225" font-size="11">※実際の位置・方角・経路・縮尺を示していません。</text><text x="15" y="242" font-size="11">実際の道案内には使えません。店舗・所要時間は架空です。</text></g></svg>